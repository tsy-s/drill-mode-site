<!DOCTYPE html>
<!--
  data-palette picks the light theme's colours: "mist" (default), "paper" or "dusk".
  See src/styles/tokens.css. Add ?palette=paper to any address to preview one in light mode.
-->
<html lang="en" data-palette="mist">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before the page paints, so a light-theme visitor never sees a dark flash.
      (function () {
        var root = document.documentElement;
        try {
          root.dataset.theme = localStorage.getItem("drillmode_site_theme") === "light" ? "light" : "dark";
          var preview = new URLSearchParams(location.search).get("palette");
          if (preview) sessionStorage.setItem("drillmode_palette_preview", preview);
          var palette = sessionStorage.getItem("drillmode_palette_preview");
          if (palette) { root.dataset.palette = palette; root.dataset.theme = "light"; }
        } catch (e) {
          root.dataset.theme = "dark";
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default title and description. Each page sets its own with usePageMeta(). -->
    <title>Drill Mode · Scam drills for the whole family</title>
    <meta
      name="description"
      content="Drill Mode runs safe, consent-based scam drills (calls, texts and emails) so families build the reflex before the real call."
    />
    <meta name="theme-color" content="#0a0e1a" />
    <link rel="icon" type="image/png" href="/pixi-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social preview (WhatsApp, LinkedIn, etc.). Swap /icon-512.png for a 1200×630 banner when you have one. -->
    <meta property="og:title" content="Drill Mode" />
    <meta property="og:description" content="Build the reflex before the real call." />
    <meta property="og:image" content="/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <style>
      html, body { margin: 0; background: var(--page, #05080f); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
